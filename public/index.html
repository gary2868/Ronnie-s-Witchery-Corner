<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>蘿妮的療癒空間｜線上預約</title>
<link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="wrap">
<header class="glass"><div><h1><span class="magic">✦</span> 蘿妮的療癒空間</h1></div><div id="lineLoginSlot" class="lineSlot"></div><button class="secondary" id="manageBookingBtn">查詢／修改預約</button><button class="secondary" id="myReservationsLink" type="button" hidden>我的預約</button></header>
<main>
<section class="glass panel">
<div class="steps"><span class="step active">1 選擇日期</span><span class="step">2 選擇服務</span><span class="step">3 選擇時間</span><span class="step">4 填寫資料</span><span class="step">5 確認</span></div>
<div id="dateView"><h2>選擇日期</h2><div class="hint st-94aa034c">當日不可預約；僅開放三個月內日期預約</div><div class="calendarHead"><button id="prevMonth" class="secondary">‹</button><strong id="monthTitle"></strong><button id="nextMonth" class="secondary">›</button></div><div class="calendar" id="calendar"></div></div>
<div id="serviceView" class="hidden"><h2>選擇服務</h2><div class="hint" id="serviceHint"></div><div class="serviceGrid" id="serviceGrid"></div><div class="actions"><button type="button" id="backDate" class="secondary">返回日期</button><button type="button" id="toSlots">下一步</button></div></div>
<div id="slotView" class="hidden"><h2>選擇時間</h2><p id="selectedDateText"></p><div class="slots" id="slots"></div><div class="actions"><button type="button" id="backService" class="secondary">返回服務</button><button type="button" id="toForm">下一步</button></div></div>
<div id="formView" class="hidden"><h2>填寫資料</h2><label for="name">姓名</label><input id="name" maxlength="100" autocomplete="name" placeholder="請輸入姓名"><label for="birthDate">西元生日</label><input id="birthDate" type="date" min="1900-01-01" autocomplete="bday"><label for="phone">電話</label><input id="phone" type="tel" maxlength="30" autocomplete="tel" inputmode="tel" placeholder="請輸入電話"><label for="note">有什麼想對我說的話嗎？或是你此刻的心情</label><textarea id="note" maxlength="500" rows="4" placeholder="請輸入"></textarea><div class="summaryBox" id="formSummary"></div><div id="formValidation" class="notice hidden" role="alert"></div><div class="actions"><button type="button" id="backSlot" class="secondary">返回時間</button><button id="toConfirm" type="button">確認資料</button></div></div>
<div id="confirmView" class="hidden"><h2>確認預約</h2><div class="summaryBox" id="confirmSummary"></div><div class="actions"><button type="button" id="backForm" class="secondary">返回修改</button><button type="button" id="submit" class="successBtn">確認預約</button></div></div>
<div id="successView" class="hidden"><h2>預約完成 ✦</h2><div class="success"><div>你的預約已成功建立。</div><div id="successSummary" class="summary"></div></div><div class="actions"><button type="button" id="copyBtn" class="successBtn">Line官方帳號</button><button type="button" id="officialBtn">關於我</button><button type="button" id="manageAfterBooking" class="secondary">返回預約</button></div><div id="successNotice" class="notice">如需管理預約，請使用電話號碼進行「查詢／修改預約」</div><div id="lineBindNotice" class="notice hidden"></div></div>
</section>

</main>
</div>
<script src="/js/ui-dialog.js"></script>
<script src="/js/index.js"></script>
</body></html>
