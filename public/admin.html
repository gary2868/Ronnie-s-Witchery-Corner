<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>蘿妮的療癒空間｜管理後台</title>
<style>
:root{--violet:#8e76b7;--violet-dark:#4d3b67;--cream:#fffaf2;--amber:#c89b50;--ink:#30263a;--muted:#71657d;--line:#e8dfed;--glass:rgba(255,255,255,.86)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(135deg,#f3edf8 0%,#e8def1 48%,#fbf3e7 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(200,155,80,.22) 0 1px,transparent 1.5px);background-size:100px 100px;opacity:.25}.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}.glass{background:var(--glass);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(72,50,92,.12);border-radius:24px}.panel{padding:25px}header{padding:24px 28px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:18px}h1{margin:0;font-size:30px;letter-spacing:.08em;color:var(--violet-dark)}h2{margin:0 0 14px}.magic{color:var(--amber)}.sub,.muted{color:var(--muted)}button{border:1px solid transparent;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,#9e87c5,#72588f);color:white;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(72,50,92,.14)}button:disabled{opacity:.42;cursor:not-allowed}.secondary{background:white;color:var(--violet-dark);border-color:var(--line);box-shadow:none}.danger{background:#8d5c6d}input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}label{display:block;margin:14px 0 7px;color:#5e5268}.login{max-width:480px;margin:70px auto}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}.adminTools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.adminTools input{max-width:190px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab.active{box-shadow:0 0 0 2px rgba(200,155,80,.35)}.hidden{display:none!important}.notice{padding:10px 12px;background:#f7f1fa;border-radius:10px;color:#655873;font-size:13px;margin-top:12px}.admin-list{display:grid;gap:10px}.booking{padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.inlineDetail{flex:0 0 100%;width:100%;min-width:0;max-width:100%;box-sizing:border-box;align-self:stretch;margin-left:0;margin-right:0}.calendarStatusLegend{display:none!important}.booking.cancelled{opacity:.62}.status{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee8f4;color:#675778;font-size:12px}.bookingActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.detail{margin-top:12px;padding:15px;background:#fbf9fd;border:1px solid var(--line);border-radius:14px;line-height:1.85}.detailGrid{display:grid;grid-template-columns:140px 1fr;gap:4px 12px}#myNoteInput{font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}.detailLabel{color:var(--muted)}.slotList{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-word}.calendarHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:13px;padding:7px}.calDay{min-height:86px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;padding:8px;box-shadow:none}.calDay:hover{border-color:#bca8d2}.calDay.past{opacity:.45}.calDay.closed{background:#f5eef7}.calDay.full{background:#f8ecef}.calDay.partial{background:#fff8eb}.calDay.selected{outline:2px solid var(--amber)}.calCount{font-size:12px;color:var(--muted);margin-top:8px}.calSlots{font-size:11px;line-height:1.45;margin-top:5px;color:var(--violet-dark);word-break:break-word}.customerList{display:grid;gap:10px}.customer{padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px}.history{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.8}.historyJump{padding:0;background:transparent;color:var(--violet-dark);border:0;box-shadow:none;font:inherit;font-weight:700;text-align:left;text-decoration:underline;cursor:pointer} .customer details>summary{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--violet-dark);font-weight:700;cursor:pointer;list-style-position:inside}.customer details>summary:hover{border-color:#bca8d2}.historyJump:hover{color:var(--amber)}.customerHistoryItem{line-height:1.8}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}.legend span{padding:4px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}
@media(max-width:800px){.wrap{padding:16px 12px 45px}.panel{padding:19px}.booking{align-items:flex-start;flex-direction:column}.booking>.inlineDetail{align-self:stretch;flex:0 0 auto;width:100%;min-width:0;max-width:100%;margin-left:0;margin-right:0;box-sizing:border-box}.booking>.inlineDetail>.detail{width:100%;max-width:100%;margin-left:0;margin-right:0}.bookingActions{width:100%}header{align-items:flex-start;flex-direction:column}.detailGrid{grid-template-columns:1fr}.adminTools input{max-width:none}.calDay{min-height:70px;padding:6px}.calendarGrid{gap:4px}}

@media(max-width:600px){
  .wrap{padding:10px 10px 32px}
  .glass{border-radius:18px}
  header{padding:18px 16px;gap:12px}
  h1{font-size:23px;line-height:1.35}
  header .secondary{width:100%;min-height:44px}
  .panel{padding:16px}
  .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .tabs button{min-height:44px;padding:10px 8px}
  .adminTools{display:grid;grid-template-columns:1fr;gap:8px}
  .adminTools input,.adminTools select,.adminTools button{max-width:none;width:100%;min-height:46px;font-size:16px}
  .booking{padding:13px;gap:12px}
  .bookingActions{display:grid;grid-template-columns:1fr;gap:7px;width:100%}
  .bookingActions button{width:100%;min-height:44px}
  .detail{overflow-wrap:anywhere}
  .detailGrid{grid-template-columns:1fr;gap:2px 0}
  .detailLabel{margin-top:8px;font-weight:700}
  .calendarHead{align-items:stretch}
  .calendarHead button{min-width:44px;min-height:44px}
  .calendarGrid{gap:3px}
  .calDay{min-height:64px;padding:5px 3px;border-radius:9px;font-size:13px}
  .calCount{font-size:10px;margin-top:5px;line-height:1.25;overflow-wrap:anywhere}
  .customer{padding:13px;overflow-wrap:anywhere}
  .history{font-size:12px;overflow-wrap:anywhere}
  .actions{flex-direction:column}
  .actions>button{width:100%;min-height:46px}
  input,select{min-height:46px;font-size:16px}
}
@media(max-width:380px){
  .wrap{padding-left:7px;padding-right:7px}
  .panel{padding:13px}
  h1{font-size:21px}
  .calDay{min-height:58px;font-size:12px}
  .calCount{font-size:9px}
}
.tagDelete{border:0;background:transparent;color:#000;cursor:pointer;padding:0 2px;font-weight:700;line-height:1}.tagDelete:hover{opacity:.7}</style>
<style>
#importConfirmModal.hidden{display:none!important}
#importConfirmModal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
#importConfirmModal .importConfirmBox{width:min(520px,100%);background:#fff;border-radius:14px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25);box-sizing:border-box}
#importConfirmModal .importConfirmText{font-size:16px;line-height:1.7;white-space:normal;margin:0 0 20px}
#importConfirmModal .importConfirmActions{display:flex;justify-content:flex-end;gap:10px}
#importConfirmModal button{min-width:90px}
</style>

<style>.tag{display:inline-block;padding:2px 8px;border-radius:12px;border:1px solid #c8b6d9;margin:2px;font-size:.85em}.statusChoice.selected{outline:2px solid currentColor}</style></head>
<body><div id="importConfirmModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="importConfirmText"><div class="importConfirmBox"><p id="importConfirmText" class="importConfirmText">匯入備份會覆蓋目前預約、客人檔案與公休資料。確定要匯入嗎？</p><div class="importConfirmActions"><button type="button" id="importCancel" class="secondary">取消</button><button type="button" id="importConfirm">確定匯入</button></div></div></div><div class="wrap">
<header class="glass"><div><h1><span class="magic">✦</span> 蘿妮的療癒空間</h1><div class="sub">管理員專用後台</div></div><button id="logout" class="secondary hidden">登出</button></header>
<section id="loginPanel" class="glass panel login"><h2>管理員登入</h2><div class="muted">請輸入管理員密碼。</div><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><span></span><button id="login">登入</button></div><div id="loginMsg" class="notice hidden"></div></section>
<section id="adminPanel" class="glass panel hidden">
<div class="tabs"><button id="tabCalendar" class="tab active">行事曆</button><button id="tabReservations" class="tab secondary">預約紀錄</button><button id="tabCustomers" class="tab secondary">客人檔案</button><button id="tabClosures" class="tab secondary">公休設定</button><button id="exportData" class="tab secondary">一鍵匯出後台資料</button><button id="backupDrive" class="tab secondary">備份到 Google Drive</button><button id="importData" class="tab secondary">匯入後台資料</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div>
<div id="calendarView"><div class="calendarHead"><button id="prevMonth" class="secondary">‹ 上月</button><h2 id="monthTitle"></h2><button id="nextMonth" class="secondary">下月 ›</button></div><div class="legend calendarStatusLegend" aria-hidden="true"><span>可預約</span><span>部分預約</span><span>已預約</span><span>部分公休</span><span>滿額</span><span>公休</span><span>當日不可預約</span><span>過去</span><span>不可預約</span></div><div id="calendarGrid" class="calendarGrid"></div><div id="calendarNotice" class="notice hidden"></div></div>
<div id="reservationView" class="hidden"><div class="adminTools"><input id="adminDate" type="date"><button id="refreshAdmin">查詢</button><button id="clearAdmin" class="secondary">清除日期</button></div><div id="adminContent"></div><div id="detailContent"></div></div>
<div id="closureView" class="hidden"><div class="notice">可設定全天公休，或指定 30 分鐘區間為不可預約時間。</div><div class="adminTools"><input id="closureDate" type="date"><select id="closureMode"><option value="all">全天公休</option><option value="range">指定時段公休</option></select><select id="closureStart" class="hidden"></select><select id="closureEnd" class="hidden"></select><button id="addClosure">新增公休</button></div><div id="closureContent"></div></div>
<div id="customerView" class="hidden"><div class="adminTools"><input id="customerSearch" placeholder="電話搜尋"><button id="refreshCustomers">重新整理</button></div><div id="customerContent"></div></div>
</section></div>
<script>
const $=id=>document.getElementById(id);const api=async(url,opt={})=>{const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||'操作失敗');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let calendarMonth=new Date();let customers=[];function filterCustomersByPhone(){const q=String($('customerSearch').value||'').replace(/\D/g,'');return q?customers.filter(c=>String(c.phone||'').replace(/\D/g,'').includes(q)):customers}
function showLogin(){$('adminPanel').classList.add('hidden');$('logout').classList.add('hidden');$('loginPanel').classList.remove('hidden')}
async function exportData(){try{const r=await fetch('/api/admin/export');if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'匯出失敗')}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Ronnie’s Witchery Corner-backup-v2-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){if(e.message==='未登入')showLogin();else alert(e.message)}}
function showImportConfirm(){return new Promise(resolve=>{const modal=$('importConfirmModal');const ok=$('importConfirm');const cancel=$('importCancel');const close=value=>{modal.classList.add('hidden');ok.onclick=null;cancel.onclick=null;modal.removeEventListener('click',onBackdrop);resolve(value)};const onBackdrop=e=>{if(e.target===modal)close(false)};ok.onclick=()=>close(true);cancel.onclick=()=>close(false);modal.addEventListener('click',onBackdrop);modal.classList.remove('hidden');ok.focus()})}
async function importDataFromFile(file){if(!file)return;try{if(!await showImportConfirm())return;const text=await file.text();let payload;try{payload=JSON.parse(text)}catch{throw new Error('JSON 備份檔格式錯誤，無法讀取')}const r=await fetch('/api/admin/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'匯入失敗');alert(`匯入完成\n預約：${d.reservations} 筆\n客人檔案：${d.customers} 筆\n公休：${d.closures} 筆`);adminCalendarCache.clear();await loadCalendar(true);await loadAdmin();await loadCustomers();await loadClosures()}catch(e){if(e.message==='未登入')showLogin();else alert(e.message)}finally{$('importFile').value=''}}
function showTab(name){['calendar','reservation','customer','closure'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==name));$('tabCalendar').classList.toggle('active',name==='calendar');$('tabReservations').classList.toggle('active',name==='reservation');$('tabCustomers').classList.toggle('active',name==='customer');$('tabClosures').classList.toggle('active',name==='closure');$('tabCalendar').classList.toggle('secondary',name!=='calendar');$('tabReservations').classList.toggle('secondary',name!=='reservation');$('tabCustomers').classList.toggle('secondary',name!=='customer');$('tabClosures').classList.toggle('secondary',name!=='closure')}
const adminCalendarCache=new Map();
async function fetchAdminCalendar(y,m,force=false){const key=`${y}-${String(m).padStart(2,'0')}`;if(!force&&adminCalendarCache.has(key))return adminCalendarCache.get(key);const promise=api(`/api/admin/calendar?year=${y}&month=${m}`);if(!force)adminCalendarCache.set(key,promise);try{return await promise}catch(e){adminCalendarCache.delete(key);throw e}}
function renderAdminCalendar(data){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth()+1;const map=new Map(data.map(x=>[x.date,x]));const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();let html=['<div class="dow">日</div>','<div class="dow">一</div>','<div class="dow">二</div>','<div class="dow">三</div>','<div class="dow">四</div>','<div class="dow">五</div>','<div class="dow">六</div>'].join('');for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=days;d++){const date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,x=map.get(date),status=String(x?.status||'');let eventLabel=labelStatus(status); if(status==='AVAILABLE') eventLabel='';const reservationCount=Number(x?.reservationCount||0);if(reservationCount>0 && status!=='CLOSED' && status!=='PARTIAL_CLOSED' && status!=='TODAY' && status!=='PAST' && status!=='UNAVAILABLE' && status!=='FULL')eventLabel=`已預約 ${reservationCount} 筆`;else if(status==='RESERVED')eventLabel='已預約';html+=`<button type="button" class="calDay ${status.toLowerCase()}" data-date="${date}" data-status="${status}"><b>${d}</b><div class="calCount">${esc(eventLabel)}</div></button>`}const grid=$('calendarGrid');grid.innerHTML=html;grid.querySelectorAll('.calDay').forEach(b=>b.onclick=()=>{const status=b.dataset.status;if(status==='UNAVAILABLE'||status==='CLOSED')return;$('adminDate').value=b.dataset.date;showTab('reservation');loadAdmin()})}
async function loadCalendar(force=false){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth()+1;$('monthTitle').textContent=`${y} 年 ${m} 月`;const grid=$('calendarGrid');grid.setAttribute('aria-busy','true');if(force)adminCalendarCache.delete(`${y}-${String(m).padStart(2,'0')}`);try{const data=await fetchAdminCalendar(y,m,force);renderAdminCalendar(data);grid.setAttribute('aria-busy','false');const py=m===1?y-1:y,pm=m===1?12:m-1,ny=m===12?y+1:y,nm=m===12?1:m+1;fetchAdminCalendar(py,pm).catch(()=>{});fetchAdminCalendar(ny,nm).catch(()=>{})}catch(e){grid.setAttribute('aria-busy','false');if(e.message==='未登入'){showLogin();return}$('calendarNotice').textContent=e.message;$('calendarNotice').classList.remove('hidden')}}
function labelStatus(s){return ({AVAILABLE:'可預約',PARTIAL:'部分預約',RESERVED:'已預約',FULL:'滿額',CLOSED:'公休',PARTIAL_CLOSED:'部分公休',TODAY:'當日不可預約',PAST:'過去',UNAVAILABLE:'不可預約'})[s]||''}
function isExpiredReservation(x){if(!x||!x.date||!x.endTime)return false;const d=new Date(`${x.date}T${x.endTime}:00`);return d.getTime() < Date.now();}
function displayStatus(x){return x.statusLabel?(x.statusLabel==='Other'&&x.otherStatus?x.otherStatus:x.statusLabel):(isExpiredReservation(x)&&x.status!=='CANCELLED'?'Expired':x.status);}
async function loadAdmin(){try{const date=$('adminDate').value;let list=await api('/api/admin/reservations'+(date?'?date='+encodeURIComponent(date):''));const active=list.filter(x=>!isExpiredReservation(x)&&x.status!=='CANCELLED').sort((a,b)=>`${a.date}${a.startTime}`.localeCompare(`${b.date}${b.startTime}`));const expired=list.filter(x=>isExpiredReservation(x)&&x.status!=='CANCELLED').sort((a,b)=>`${b.date}${b.startTime}`.localeCompare(`${a.date}${a.startTime}`));const cancelled=list.filter(x=>x.status==='CANCELLED').sort((a,b)=>`${b.date}${b.startTime}`.localeCompare(`${a.date}${a.startTime}`));list=[...active,...expired,...cancelled];$('adminContent').innerHTML=list.length?`<div class="admin-list">${list.map(x=>`<div class="booking ${x.status==='CANCELLED'?'cancelled':''} ${isExpiredReservation(x)&&x.status!=='CANCELLED'?'expired':''}"><div><b>${esc(x.name)}</b> ${Array.isArray(x.tags)&&x.tags.length?x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(' '):''}<br>預約日期：${esc(x.date)} · ${esc(x.startTime)}–${esc(x.endTime)}<br>${esc(x.serviceName)}<div class="muted"><span class="status">${esc(displayStatus(x))}</span></div></div><div class="bookingActions"><button class="secondary" onclick="showDetail('${encodeURIComponent(x.id)}')">查看詳細</button>${x.status!=='CANCELLED'&&!isExpiredReservation(x)?`<button class="danger" onclick="cancelBooking('${encodeURIComponent(x.id)}')">取消預約</button>`:''}</div><div id="detail-${encodeURIComponent(x.id)}" class="inlineDetail"></div></div>`).join('')}</div>`:'目前沒有預約紀錄。'}catch(e){if(e.message==='未登入'){showLogin();return}$('adminContent').innerHTML=`<p>${esc(e.message)}</p>`}}
async function showDetail(id){const existing=$('detail-'+id);if(existing&&existing.innerHTML.trim()){existing.innerHTML='';return}try{const list=await api('/api/admin/reservations');const x=list.find(a=>a.id===decodeURIComponent(id));if(!x)return;const noteValue=String(x.myNote||'').replace(/"/g,'&quot;');const tags=Array.isArray(x.tags)?x.tags:[];const status=x.statusLabel||'';window.currentDetailReservation=x;const detailBox=$('detail-'+encodeURIComponent(x.id));if(!detailBox)return;detailBox.innerHTML=`<div class="detail"><h2>預約詳細資訊</h2><div><b>標籤：</b><span id="reservationTags">${tags.map(t=>`<span class="tag">${esc(t)} <button type="button" class="tagDelete" onclick="deleteReservationTag('${encodeURIComponent(t)}')">×</button></span>`).join(' ')}</span><div><input id="reservationTagInput" maxlength="30" placeholder="新增標籤"><button class="secondary" onclick="addReservationTag()">新增標籤</button></div></div><div class="detailGrid"><div class="detailLabel">姓名</div><div>${esc(x.name)}</div><div class="detailLabel">生日</div><div>${esc(x.birthDate||'—')}</div><div class="detailLabel">電話</div><div>${esc(x.phone||'—')}</div><div class="detailLabel">服務</div><div>${esc(x.serviceName)}（${esc(x.durationMinutes)} 分鐘）</div><div class="detailLabel">預約時間</div><div>${esc(String(x.date||'').slice(0,10))} ${esc(x.startTime||'')}–${esc(x.endTime||'')}</div><div class="detailLabel">客人的備註</div><div>${esc(x.note||'—')}</div><div class="detailLabel">我的備註</div><div><textarea id="myNoteInput" rows="4" maxlength="500" style="width:100%;box-sizing:border-box;resize:vertical">${noteValue}</textarea></div><div class="detailLabel">預定狀態</div><div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${['Finished','Cancel','No-show','Other'].map(v=>`<button type="button" class="secondary statusChoice ${status===v?'selected':''}" onclick="chooseStatus('${v}')">${v}</button>`).join('')}<input id="otherStatusInput" class="${status==='Other'?'':'hidden'}" maxlength="100" placeholder="請輸入自定義狀態" value="${esc(x.otherStatus||'')}" style="max-width:220px;flex:1 1 180px"><button class="primary" style="margin-left:auto" onclick="saveReservationDetail('${encodeURIComponent(x.id)}')">儲存</button></div></div></div><div class="actions"><button class="secondary" onclick="this.closest('.inlineDetail').innerHTML=''">關閉</button></div></div>`;window.selectedReservationStatus=status}catch(e){if(e.message==='未登入')showLogin()}}
function chooseStatus(v){window.selectedReservationStatus=v;document.querySelectorAll('.statusChoice').forEach(b=>b.classList.toggle('selected',b.textContent===v));const input=$('otherStatusInput');if(input){input.classList.toggle('hidden',v!=='Other');if(v==='Other'){input.focus()}}}
async function saveReservationDetail(id){const v=window.selectedReservationStatus||'';const input=$('myNoteInput');if(!input){alert('找不到我的備註輸入框');return}const other=v==='Other'?($('otherStatusInput')?.value.trim()||''):'';try{const noteResult=await api('/api/admin/reservations/'+id+'/note',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({myNote:input.value})});let saved=noteResult.reservation||window.currentDetailReservation;if(v){const statusResult=await api('/api/admin/reservations/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({statusLabel:v,otherStatus:other})});saved=statusResult.reservation||saved}window.currentDetailReservation=saved;await loadAdmin();await loadCustomers()}catch(e){alert(e.message)}}
async function saveStatus(id){return saveReservationDetail(id)}
async function addReservationTag(){const x=window.currentDetailReservation;const input=$('reservationTagInput');if(!input)return;const v=input.value.trim();if(!v)return;const tags=[...new Set([...(x.tags||[]),v])].slice(0,30);try{await api('/api/admin/reservations/'+encodeURIComponent(x.id)+'/tags',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});await loadAdmin();await loadCustomers();await showDetail(x.id)}catch(e){alert(e.message)}}

async function deleteReservationTag(tag){const x=window.currentDetailReservation;if(!x)return;const t=decodeURIComponent(tag);const tags=(x.tags||[]).filter(v=>v!==t);try{const d=await api('/api/admin/reservations/'+encodeURIComponent(x.id)+'/tags',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});window.currentDetailReservation=d.reservation;$('reservationTags').innerHTML=tags.map(v=>`<span class="tag">${esc(v)} <button type="button" class="tagDelete" onclick="deleteReservationTag('${encodeURIComponent(v)}')">×</button></span>`).join(' ');await loadAdmin();await loadCustomers()}catch(e){alert(e.message)}}
async function saveMyNote(id){try{const input=$('myNoteInput');if(!input)throw new Error('找不到我的備註輸入框');const value=input.value;const d=await api('/api/admin/reservations/'+id+'/note',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({myNote:value})});window.currentDetailReservation=d.reservation;const notice=$('myNoteNotice');if(notice)notice.textContent='已儲存';await loadCustomers()}catch(e){if(e.message==='未登入')showLogin();else alert(e.message)}}
async function cancelBooking(id){if(!confirm('確定取消此筆預約？取消後時段會恢復可預約。'))return;try{await api('/api/admin/reservations/'+id+'/cancel',{method:'PATCH'});await loadAdmin();adminCalendarCache.clear();await loadCalendar()}catch(e){alert(e.message)}}
async function loadCustomers(){try{customers=await api('/api/admin/customers');renderCustomers()}catch(e){if(e.message==='未登入')showLogin()}}
function renderCustomers(){const q=$('customerSearch').value.trim().toLowerCase();const list=filterCustomersByPhone().filter(c=>!q||c.name.toLowerCase().includes(q)||String(c.phone||'').toLowerCase().includes(q));$('customerContent').innerHTML=list.length?`<div class="customerList">${list.map(c=>{const tags=Array.isArray(c.tags)?c.tags:[];return `<div class="customer"><b>${esc(c.name)}</b> ${tags.map(t=>`<span class="tag">${esc(t)} <button type="button" class="tagDelete" onclick="deleteCustomerTag('${encodeURIComponent(c.id)}','${encodeURIComponent(t)}')">×</button></span>`).join(' ')}<br>電話：${esc(c.phone||'—')}<br>生日：${esc(c.birthDate||'—')}<details><summary>查看詳細資料</summary><div class="history"><div><input id="ct-${esc(c.id)}" placeholder="新增標籤"><button class="secondary" onclick="addCustomerTag('${encodeURIComponent(c.id)}')">新增標籤</button></div>歷史預約紀錄：${c.history?.length||0} 筆<hr>${(c.history||[]).map(h=>`<div class="customerHistoryItem"><button type="button" class="historyJump" onclick="openCustomerReservation('${encodeURIComponent(h.reservationId||'')}')"><span>${esc(String(h.date||'').slice(0,10))} ${esc(h.startTime||'')}–${esc(h.endTime||'')} · ${esc(h.serviceName||'')}</span></button><br>客人的備註：${esc(h.note||'—')}<br>我的備註：${esc(h.myNote||'—')}<br>預定狀態：${esc(h.statusLabel || (h.status==='CANCELLED' ? 'CANCELLED' : '—'))}${h.statusLabel==='Other'&&h.otherStatus?'（'+esc(h.otherStatus)+'）':''}</div>`).join('<hr>')||'尚無歷史預約'}</div></details></div>`}).join('')}</div>`:'目前沒有符合的客人檔案。'}
async function openCustomerReservation(id){const rid=decodeURIComponent(id||'');if(!rid)return;try{showTab('reservation');await loadAdmin();const detail=$('detail-'+encodeURIComponent(rid));if(detail){const row=detail.closest('.booking');if(row)row.scrollIntoView({behavior:'smooth',block:'center'});await showDetail(rid);}}catch(e){if(e.message==='未登入')showLogin();else alert(e.message)}}
async function addCustomerTag(id){const cid=decodeURIComponent(id),c=customers.find(x=>x.id===cid),input=$('ct-'+cid);if(!c||!input)return;const v=input.value.trim();if(!v)return;const tags=[...new Set([...(c.tags||[]),v])].slice(0,30);try{const d=await api('/api/admin/customers/'+id+'/tags',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});c.tags=d.customer.tags;renderCustomers()}catch(e){alert(e.message)}}

async function deleteCustomerTag(id,tag){const cid=decodeURIComponent(id),t=decodeURIComponent(tag),c=customers.find(x=>x.id===cid);if(!c)return;const tags=(c.tags||[]).filter(v=>v!==t);try{const d=await api('/api/admin/customers/'+id+'/tags',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});c.tags=d.customer.tags;renderCustomers();await loadAdmin()}catch(e){alert(e.message)}}

function fillClosureTimes(){const starts=[];for(let m=9*60;m<=20*60;m+=30)starts.push(`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`);$('closureStart').innerHTML=starts.map(t=>`<option value="${t}">${t}</option>`).join('');$('closureMode').onchange=()=>{const range=$('closureMode').value==='range';$('closureStart').classList.toggle('hidden',!range);$('closureEnd').classList.toggle('hidden',!range);if(range){$('closureStart').value=starts[0];updateClosureEnds()}else{$('closureStart').value='';$('closureEnd').innerHTML='';}};$('closureStart').onchange=updateClosureEnds;function updateClosureEnds(){const v=$('closureStart').value;if(!v)return;const a=v.split(':').map(Number);const start=a[0]*60+a[1]+30;let opts='';for(let m=start;m<=21*60;m+=30)opts+=`<option value="${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}">${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</option>`;$('closureEnd').innerHTML=opts;}}
async function loadClosures(){try{const list=await api('/api/admin/closures');$('closureContent').innerHTML=list.length?`<div class="admin-list">${list.map(x=>`<div class="booking"><div><b>${esc(x.date)}</b><br>${x.startTime?`${esc(x.startTime)}–${esc(x.endTime)} 不可預約`:'全天公休'}</div><button class="danger" onclick="deleteClosure('${encodeURIComponent(x.id)}')">刪除</button></div>`).join('')}</div>`:'目前沒有公休設定。';}catch(e){if(e.message==='未登入')showLogin();else $('closureContent').innerHTML=`<p>${esc(e.message)}</p>`}}
async function addClosure(){const date=$('closureDate').value,range=$('closureMode').value==='range',start=range?$('closureStart').value:'',end=range?$('closureEnd').value:'';if(!date){alert('請選擇公休日期');return;}if(range&&!end){alert('請選擇公休結束時間');return;}try{await api('/api/admin/closures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,startTime:start,endTime:end})});$('closureDate').value='';$('closureMode').value='all';$('closureStart').classList.add('hidden');$('closureEnd').classList.add('hidden');await loadClosures();adminCalendarCache.clear();await loadCalendar();}catch(e){alert(e.message)}}
async function deleteClosure(id){if(!confirm('確定刪除此公休設定？刪除後該時段會恢復可預約。'))return;try{await api('/api/admin/closures/'+id,{method:'DELETE'});await loadClosures();adminCalendarCache.clear();await loadCalendar()}catch(e){alert(e.message)}}
async function login(){const password=$('password').value;if(!password){$('loginMsg').textContent='請輸入密碼。';$('loginMsg').classList.remove('hidden');return}try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});$('password').value='';$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('logout').classList.remove('hidden');showTab('calendar');await loadCalendar()}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').classList.remove('hidden')}}
async function backupToDrive(){try{const r=await fetch('/api/admin/backup-to-drive',{method:'POST'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Google Drive 備份失敗');alert('已送出 Google Drive 備份');}catch(e){if(e.message==='未登入')showLogin();else alert(e.message)}}
$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('exportData').onclick=exportData;$('backupDrive').onclick=backupToDrive;$('importData').onclick=()=>$('importFile').click();$('importFile').onchange=e=>importDataFromFile(e.target.files[0]);$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});showLogin()};$('prevMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);loadCalendar(true)};$('nextMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);loadCalendar(true)};$('tabCalendar').onclick=()=>{showTab('calendar');loadCalendar(true)};$('tabReservations').onclick=()=>{showTab('reservation');loadAdmin()};$('tabCustomers').onclick=()=>{showTab('customer');loadCustomers()};$('tabClosures').onclick=()=>{showTab('closure');loadClosures()};$('addClosure').onclick=addClosure;fillClosureTimes();$('refreshAdmin').onclick=loadAdmin;document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('adminPanel').classList.contains('hidden')&&!$('calendarView').classList.contains('hidden'))loadCalendar(true)});$('clearAdmin').onclick=()=>{$('adminDate').value='';loadAdmin()};$('refreshCustomers').onclick=loadCustomers;$('customerSearch').oninput=renderCustomers;
loadCalendar().then(()=>{if(!$('adminPanel').classList.contains('hidden')){showTab('calendar')}});
</script></body></html>
