
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蘿妮的療癒空間｜管理後台</title>
<style>
:root{--violet:#8e76b7;--violet-dark:#4d3b67;--cream:#fffaf2;--amber:#c89b50;--ink:#30263a;--muted:#71657d;--line:#e8dfed;--glass:rgba(255,255,255,.86)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(135deg,#f3edf8 0%,#e8def1 48%,#fbf3e7 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(200,155,80,.22) 0 1px,transparent 1.5px);background-size:100px 100px;opacity:.25}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(72,50,92,.12);border-radius:24px}
.panel{padding:25px}
header{padding:24px 28px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:18px}
h1{margin:0;font-size:30px;letter-spacing:.08em;color:var(--violet-dark)}
h2{margin:0 0 14px}
.magic{color:var(--amber)}
.sub,.muted{color:var(--muted)}
button{border:1px solid transparent;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,#9e87c5,#72588f);color:white;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(72,50,92,.14)}
button:disabled{opacity:.42;cursor:not-allowed}
.secondary{background:white;color:var(--violet-dark);border-color:var(--line);box-shadow:none}
.danger{background:#8d5c6d}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
label{display:block;margin:14px 0 7px;color:#5e5268}
.login{max-width:480px;margin:70px auto}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.adminTools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.adminTools input{max-width:190px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab.active{box-shadow:0 0 0 2px rgba(200,155,80,.35)}
.hidden{display:none!important}
.notice{padding:10px 12px;background:#f7f1fa;border-radius:10px;color:#655873;font-size:13px;margin-top:12px}
.admin-list{display:grid;gap:10px}
.booking{padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
.inlineDetail{flex:0 0 100%;width:100%;min-width:0;max-width:100%;box-sizing:border-box;align-self:stretch;margin-left:0;margin-right:0}
.calendarStatusLegend{display:none!important}
.booking.cancelled{opacity:.62}
.adminAccordion{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fbf9fd;overflow:hidden}
.adminAccordion>summary{cursor:pointer;list-style:none;padding:12px 15px;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none}
.adminAccordion>summary::-webkit-details-marker{display:none}
.adminAccordion>summary::before{content:'▸';display:inline-block;transition:transform .15s;color:var(--muted)}
.adminAccordion[open]>summary::before{transform:rotate(90deg)}
.adminAccordion .accCount{font-weight:400;font-size:12px;color:var(--muted);background:#eee8f4;border-radius:999px;padding:1px 8px}
.adminAccordion>.admin-list{padding:0 12px 12px}
.booking.expired{opacity:.8}
.status{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee8f4;color:#675778;font-size:12px}
.bookingActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.detail{margin-top:12px;padding:15px;background:#fbf9fd;border:1px solid var(--line);border-radius:14px;line-height:1.85}
.detailGrid{display:grid;grid-template-columns:140px 1fr;gap:4px 12px}
#myNoteInput{font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.detailLabel{color:var(--muted)}
.slotList{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-word}
.calendarHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;color:var(--muted);font-size:13px;padding:7px}
.calDay{min-height:86px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;padding:8px;box-shadow:none}
.calDay:hover{border-color:#bca8d2}
.calDay.past{opacity:.45}
.calDay.closed{background:#f5eef7}
.calDay.full{background:#f8ecef}
.calDay.partial{background:#fff8eb}
.calDay.selected{outline:2px solid var(--amber)}
.calCount{font-size:12px;color:var(--muted);margin-top:8px}
.calSlots{font-size:11px;line-height:1.45;margin-top:5px;color:var(--violet-dark);word-break:break-word}
.customerList{display:grid;gap:10px}
.customer{padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px}
.history{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.8}
.historyJump{padding:0;background:transparent;color:var(--violet-dark);border:0;box-shadow:none;font:inherit;font-weight:700;text-align:left;text-decoration:underline;cursor:pointer}
.customer details>summary{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--violet-dark);font-weight:700;cursor:pointer;list-style-position:inside}
.customer details>summary:hover{border-color:#bca8d2}
.historyJump:hover{color:var(--amber)}
.customerHistoryItem{line-height:1.8}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{padding:4px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}
@media(max-width:800px){
.wrap{padding:16px 12px 45px}
.panel{padding:19px}
.booking{align-items:flex-start;flex-direction:column}
.booking>.inlineDetail{align-self:stretch;flex:0 0 auto;width:100%;min-width:0;max-width:100%;margin-left:0;margin-right:0;box-sizing:border-box}
.booking>.inlineDetail>.detail{width:100%;max-width:100%;margin-left:0;margin-right:0}
.bookingActions{width:100%}
header{align-items:flex-start;flex-direction:column}
.detailGrid{grid-template-columns:1fr}
.adminTools input{max-width:none}
.calDay{min-height:70px;padding:6px}
.calendarGrid{gap:4px}
}
@media(max-width:600px){
.wrap{padding:10px 10px 32px}
.glass{border-radius:18px}
header{padding:18px 16px;gap:12px}
h1{font-size:23px;line-height:1.35}
header .secondary{width:100%;min-height:44px}
.panel{padding:16px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tabs button{min-height:44px;padding:10px 8px}
.adminTools{display:grid;grid-template-columns:1fr;gap:8px}
.adminTools input,.adminTools select,.adminTools button{max-width:none;width:100%;min-height:46px;font-size:16px}
.booking{padding:13px;gap:12px}
.bookingActions{display:grid;grid-template-columns:1fr;gap:7px;width:100%}
.bookingActions button{width:100%;min-height:44px}
.detail{overflow-wrap:anywhere}
.detailGrid{grid-template-columns:1fr;gap:2px 0}
.detailLabel{margin-top:8px;font-weight:700}
.calendarHead{align-items:stretch}
.calendarHead button{min-width:44px;min-height:44px}
.calendarGrid{gap:3px}
.calDay{min-height:64px;padding:5px 3px;border-radius:9px;font-size:13px}
.calCount{font-size:10px;margin-top:5px;line-height:1.25;overflow-wrap:anywhere}
.customer{padding:13px;overflow-wrap:anywhere}
.history{font-size:12px;overflow-wrap:anywhere}
.actions{flex-direction:column}
.actions>button{width:100%;min-height:46px}
input,select{min-height:46px;font-size:16px}
}
@media(max-width:380px){
.wrap{padding-left:7px;padding-right:7px}
.panel{padding:13px}
h1{font-size:21px}
.calDay{min-height:58px;font-size:12px}
.calCount{font-size:9px}
}
.tagDelete{border:0;background:transparent;color:#000;cursor:pointer;padding:0 2px;font-weight:700;line-height:1}
.tagDelete:hover{opacity:.7}
#importConfirmModal.hidden{display:none!important}
#importConfirmModal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
#importConfirmModal .importConfirmBox{width:min(520px,100%);background:#fff;border-radius:14px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25);box-sizing:border-box}
#importConfirmModal .importConfirmText{font-size:16px;line-height:1.7;white-space:normal;margin:0 0 20px}
#importConfirmModal .importConfirmActions{display:flex;justify-content:flex-end;gap:10px}
#importConfirmModal button{min-width:90px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;border:1px solid #c8b6d9;margin:2px;font-size:.85em}
.statusChoice.selected{outline:2px solid currentColor}

.custHistory{width:100%;flex-basis:100%}
.svcMain{flex:1 1 240px;min-width:0}
.svcNums{flex:0 0 150px}
.svcSide{flex:0 0 auto}
@media(max-width:800px){
  .serviceRow{flex-direction:column;align-items:stretch;gap:4px}
  .svcMain,.svcNums,.svcSide{flex:none;width:100%}
  .svcMain input.svcName,.svcMain input.svcDesc{width:100%;box-sizing:border-box}
  .svcMain label,.svcNums label{display:block;margin-top:4px}
  .svcNums{display:flex;gap:12px}
  .svcNums > div{flex:1 1 0}
  .svcNums input{width:100%;box-sizing:border-box}
  .svcSide{display:flex;justify-content:flex-end;align-items:flex-end;margin-top:2px}
  .svcSide label{display:flex;align-items:center;gap:4px;font-size:12px;margin:0}
  .svcSide input.svcActive{width:20px;height:20px;margin:0}
}

.pageNotice{position:fixed;inset:0;background:rgba(40,30,50,.38);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.pageNotice.hidden{display:none}
.pageNoticeCard{background:#fff;border-radius:18px;padding:22px 24px 18px;min-width:240px;max-width:min(88vw,420px);box-shadow:0 18px 40px rgba(40,30,50,.25)}
.pageNoticeText{white-space:pre-line;color:#2b2233;line-height:1.7;margin-bottom:16px;font-size:16px}
.pageNoticeOk{display:block;margin-left:auto;padding:9px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,#9b7fc4,#6f5590);color:#fff;font-weight:700;cursor:pointer}
.focusFlash{animation:focusFlash 1.8s ease}
@keyframes focusFlash{0%,40%{box-shadow:0 0 0 3px #c9a7ff}100%{box-shadow:0 0 0 3px transparent}}
@media(max-width:800px){
  .tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding-bottom:6px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs > button{flex:0 0 auto;white-space:nowrap}
}
</style>
</head>
<body>
<div id="importConfirmModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="importConfirmText">
  <div class="importConfirmBox">
    <p id="importConfirmText" class="importConfirmText">匯入備份會覆蓋目前預約、客人檔案與公休資料。確定要匯入嗎？</p>
    <div class="importConfirmActions">
      <button type="button" id="importCancel" class="secondary">取消</button>
      <button type="button" id="importConfirm">確定匯入</button>
    </div>
  </div>
</div>

<div class="wrap">
<header class="glass">
  <div><h1><span class="magic">✦</span> 蘿妮的療癒空間</h1><div class="sub">管理員專用後台</div></div>
  <button id="logout" class="secondary hidden">登出</button>
</header>

<section id="loginPanel" class="glass panel login">
  <h2>管理員登入</h2>
  <div class="muted">請輸入管理員密碼。</div>
  <label for="password">密碼</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="actions"><span></span><button id="login">登入</button></div>
  <div id="loginMsg" class="notice hidden"></div>
</section>

<section id="adminPanel" class="glass panel hidden">
  <div class="tabs">
    <button id="tabCalendar" class="tab active">行事曆</button>
    <button id="tabReservations" class="tab secondary">預約紀錄</button>
    <button id="tabCustomers" class="tab secondary">客人檔案</button>
    <button id="tabClosures" class="tab secondary">公休設定</button>
    <button id="tabServices" class="tab secondary">服務設定</button>
    <button id="tabRecycle" class="tab secondary">回收桶</button>
    <button id="exportData" class="tab secondary">一鍵匯出後台資料</button>
    <button id="backupDrive" class="tab secondary">備份到 Google Drive</button>
    <button id="importData" class="tab secondary">匯入後台資料</button>
    <input id="importFile" type="file" accept=".json,application/json" class="hidden">
  </div>

  <div id="calendarView">
    <div class="calendarHead">
      <button id="prevMonth" class="secondary">‹ 上月</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth" class="secondary">下月 ›</button>
    </div>
    <div class="legend calendarStatusLegend" aria-hidden="true">
      <span>可預約</span><span>部分預約</span><span>已預約</span><span>部分公休</span><span>滿額</span><span>公休</span><span>當日不可預約</span><span>過去</span><span>不可預約</span>
    </div>
    <div id="calendarGrid" class="calendarGrid"></div>
    <div id="calendarNotice" class="notice hidden"></div>
  </div>

  <div id="reservationView" class="hidden">
    <div class="adminTools">
      <input id="adminDate" type="date">
      <button id="refreshAdmin">查詢</button>
      <button id="clearAdmin" class="secondary">清除日期</button>
      <button id="addReservationBtn" class="secondary">＋ 新增預約</button>
    </div>
    <div id="addReservationBox" class="hidden"></div>
    <div id="adminContent"></div>
    <div id="detailContent"></div>
  </div>

  <div id="closureView" class="hidden">
    <div class="notice">可設定全天公休、多日連休（每天一筆），或指定 30 分鐘區間為不可預約時間。</div>
    <div class="adminTools">
      <input id="closureDate" type="date">
      <input id="closureEndDate" type="date" class="hidden" title="連休結束日期">
      <select id="closureMode">
        <option value="all">全天公休</option>
        <option value="range">指定時段公休</option>
        <option value="multi">多日連休</option>
      </select>
      <select id="closureStart" class="hidden"></select>
      <select id="closureEnd" class="hidden"></select>
      <button id="addClosure">新增公休</button>
    </div>
    <div id="closureContent"></div>
  </div>

  <div id="serviceView" class="hidden">
    <div class="notice">服務名稱、說明、時長、價格可修改；取消勾選「前台顯示」即停用（前台不顯示、不可預約，既有預約不受影響）。時長須為 30 分鐘的倍數。</div>
    <div class="adminTools">
      <button id="addServiceRow" class="secondary">＋ 新增服務</button>
      <button id="saveServices">儲存服務設定</button>
    </div>
    <div id="serviceContent"></div>
  </div>

  <div id="recycleView" class="hidden">
    <div class="notice">已刪除的預約與客人會先移入這裡，可還原或永久移除。永久移除後無法還原。</div>
    <div id="recycleContent"></div>
  </div>

  <div id="customerView" class="hidden">
    <div class="adminTools">
      <input id="customerSearch" placeholder="電話搜尋">
      <button id="refreshCustomers">重新整理</button>
      <button id="addCustomerBtn" class="secondary">＋ 新增客人</button>
    </div>
    <div id="addCustomerBox" class="hidden"></div>
    <div id="customerContent"></div>
  </div>
</section>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
