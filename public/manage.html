<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>蘿妮的療癒空間｜管理我的預約</title>
<style>
:root{--violet:#8e76b7;--violet-dark:#4d3b67;--cream:#fffaf2;--amber:#c89b50;--ink:#30263a;--muted:#71657d;--line:#e8dfed;--glass:rgba(255,255,255,.86)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(135deg,#f3edf8 0%,#e8def1 48%,#fbf3e7 100%)}
.wrap{max-width:760px;margin:auto;padding:28px 18px 70px}.glass{background:var(--glass);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(72,50,92,.12);border-radius:24px}header{padding:24px 28px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:28px;color:var(--violet-dark)}h2{margin:0 0 14px}.magic{color:var(--amber)}.muted,.hint{color:var(--muted);font-size:14px}button{border:1px solid transparent;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#9e87c5,#72588f);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:white;color:var(--violet-dark);border-color:var(--line)}.danger{background:#8d5c6d}label{display:block;margin:15px 0 7px;color:#5e5268}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;font:inherit}input:focus,select:focus{border-color:#ad95c7;box-shadow:0 0 0 3px rgba(142,118,183,.12)}.panel{padding:26px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.summary{padding:16px;border-radius:14px;background:#faf7fc;border:1px solid var(--line);line-height:1.9}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.slot{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none}.slot.selected{background:#fff8eb;border-color:var(--amber);color:#745526}.slot.booked{opacity:.42;text-decoration:line-through}.notice{padding:12px;border-radius:12px;background:#f7f1fa;color:#655873;font-size:14px;margin-top:14px}.hidden{display:none!important}.status{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee8f4;color:#675778;font-size:12px}@media(max-width:600px){.slots{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start;flex-direction:column}.panel{padding:20px}}

@media(max-width:600px){
  .wrap{padding:10px 10px 32px}
  .glass{border-radius:18px}
  header{padding:18px 16px;gap:12px}
  h1{font-size:23px;line-height:1.35}
  header button{width:100%;min-height:44px}
  .panel{padding:16px}
  .actions{flex-direction:column;gap:8px}
  .actions>button{width:100%;min-height:46px}
  input,select{min-height:46px;font-size:16px}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .slot{min-height:46px;padding:11px 8px}
  .summary{overflow-wrap:anywhere}
}
@media(max-width:380px){
  .wrap{padding-left:7px;padding-right:7px}
  .panel{padding:13px}
  h1{font-size:21px}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.bindCodeText{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1em;letter-spacing:.1em;font-weight:700}
.copyBindBtn{margin:0 8px;padding:4px 10px;font-size:.85em}
</style>
</head>
<body>
<div class="wrap">
<header class="glass"><div><h1><span class="magic">✦</span> 管理我的預約</h1><div class="muted">請輸入預約時填寫的電話查詢訂單。</div></div><button class="secondary" data-act="goHome">返回預約</button></header>
<section class="glass panel">
<div id="lookupView">
<h2>查詢預約</h2>

<label for="phone">電話</label><input id="phone" type="tel" maxlength="30" autocomplete="tel" inputmode="tel" placeholder="請輸入預約時填寫的電話">
<label for="bookingCode">預約代碼</label><input id="bookingCode" type="text" maxlength="20" autocomplete="off" placeholder="預約完成時顯示(若忘記請聯絡LINE官方帳號)">
<div class="actions"><span></span><button id="lookupBtn">查詢預約</button></div>
</div>
<div id="manageView" class="hidden">
<h2>目前預約</h2><div id="currentSummary" class="summary"></div>
<label for="newDate">修改日期</label><input id="newDate" type="date">
<label for="newService">修改服務</label><select id="newService"></select>
<label>修改時間</label><div id="slotHint" class="hint">請選擇日期與服務。</div><div id="slots" class="slots"></div>
<div class="actions"><button id="backLookup" class="secondary">查詢其他預約</button><button id="updateBtn">確認修改預約</button><button id="cancelBtn" class="danger">取消預約</button></div>
<div id="notice" class="notice hidden"></div>
</div>
</section>
</div>
<script src="/js/manage.js"></script>

<style>.reservation-history-times{margin-top:8px;line-height:1.7}</style>

<div id="confirmModal" class="confirm-modal hidden" aria-hidden="true">
  <div class="confirm-backdrop"></div>
  <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">確認操作</h3>
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button type="button" id="confirmNo" class="secondary">取消</button>
      <button type="button" id="confirmYes">確定</button>
    </div>
  </div>
</div>
<style>
.confirm-modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-modal.hidden{display:none!important}
.confirm-backdrop{position:absolute;inset:0;background:rgba(35,25,45,.38);backdrop-filter:blur(3px)}
.confirm-dialog{position:relative;width:min(420px,100%);background:#fffaf2;border:1px solid #e8dfed;border-radius:18px;box-shadow:0 24px 70px rgba(45,30,60,.25);padding:24px;color:var(--ink)}
.confirm-dialog h3{margin:0 0 10px;color:var(--violet-dark);font-size:20px}
.confirm-dialog p{margin:0;line-height:1.7;color:var(--muted)}
.confirm-change-list{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;line-height:1.8}.confirm-change-row{display:flex;gap:8px;align-items:flex-start}.confirm-change-label{font-weight:700;min-width:42px;color:var(--violet-dark)}.confirm-change-arrow{color:var(--amber);padding:0 2px}
.confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.confirm-actions button{min-width:84px}
@media(max-width:600px){.confirm-dialog{padding:20px}.confirm-actions{flex-direction:column-reverse}.confirm-actions button{width:100%;min-height:44px}}
</style>
</body></html>
